# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runtime: nodejs20

# Configuración OPTIMIZADA para juegos
runConfig:
  cpu: 2
  memoryMiB: 2048
  maxConcurrentRequests: 100
  maxInstances: 10 # Increased for production traffic

# Serve static assets from the .next/static directory
hosting:
  public: .next/static
  rewrites:
    - source: /api/statistics
      run:
        region: europe-west1
        serviceId: stats-processor
    - source: /**
      server:
        id: next-server

# Your Next.js app runs on a server
backend:
  id: next-server
  run: npm start
  env:
    NODE_ENV: production
    NEXT_PUBLIC_FIREBASE_CONFIG: "${FIREBASE_CONFIG}"
    GAME_VERSION: "1.0.0-production"

# Set security headers
headers:
  - source: "**/*.js"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"
  - source: /**
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains; preload
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: SAMEORIGIN
      - key: X-XSS-Protection
        value: "1; mode=block"
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Content-Security-Policy
        value: >
          default-src 'self';
          script-src 'self' https://apis.google.com https://www.googletagmanager.com;
          style-src 'self' 'unsafe-inline';
          img-src 'self' data: https://www.google-analytics.com;
          connect-src 'self' https://www.google-analytics.com https://firestore.googleapis.com;
          frame-src 'self' https://accounts.google.com;
